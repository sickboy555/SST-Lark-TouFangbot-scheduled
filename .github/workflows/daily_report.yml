name: 每日预算日报

on:
  workflow_dispatch:      # 由外部 cron-job.org 定时触发，或在 GitHub 网页手动触发

jobs:
  send-report:
    runs-on: windows-2025
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 发送预算日报
        run: python lark_budget_bot.py --once
        env:
          PYTHONUTF8: 1
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_SHEET_URL: ${{ secrets.LARK_SHEET_URL }}
          SEND_MODE: webhook
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          LARK_OPEN_BASE_URL: https://open.larksuite.com
          SHEET_RANGE: A1:AZ1000
          SCHEDULE_TIME: '17:00'
          TIMEZONE: Asia/Shanghai
          OUTPUT_DIR: output
